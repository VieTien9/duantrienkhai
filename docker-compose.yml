services:
  # -------------------------------------------------------------
  # 1. DATABASE: MySQL (Chỉ thuộc backend_net - Network Isolation)
  # -------------------------------------------------------------
  mysql_db:
    image: mysql:8.0
    container_name: hrm_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hrm_db}
      MYSQL_USER: ${DB_USER:-hrm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hrm_secure_password_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hrm_root_password_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-hrm_user}", "-p${DB_PASSWORD:-hrm_secure_password_2026}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - backend_net

  # -------------------------------------------------------------
  # 2. WEB APPLICATION: Node.js / Express HRM (MySQL)
  # -------------------------------------------------------------
  webapp:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: hrm_webapp
    restart: always
    environment:
      PORT: 3000
      DB_HOST: ${DB_HOST:-mysql_db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-hrm_db}
      DB_USER: ${DB_USER:-hrm_user}
      DB_PASSWORD: ${DB_PASSWORD:-hrm_secure_password_2026}
    ports:
      - "${WEBAPP_PORT:-3002}:3000"
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  # -------------------------------------------------------------
  # 3. DATABASE MANAGEMENT: phpMyAdmin
  # -------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.1
    container_name: hrm_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-5052}:80"
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  # -------------------------------------------------------------
  # 4. REVERSE PROXY: Nginx (Cổng vào chính hrm.local:8000)
  # -------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: hrm_nginx
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - webapp
      - phpmyadmin
    networks:
      - frontend_net

  # -------------------------------------------------------------
  # 5. METRICS COLLECTION: Prometheus
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: hrm_prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    depends_on:
      - webapp
      - cadvisor
    networks:
      - frontend_net

  # -------------------------------------------------------------
  # 6. CONTAINER METRICS: cAdvisor
  # -------------------------------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: hrm_cadvisor
    restart: always
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "${CADVISOR_PORT:-8085}:8080"
    networks:
      - frontend_net

  # -------------------------------------------------------------
  # 7. DASHBOARD & VISUALIZATION: Grafana
  # -------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: hrm_grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-Admin@Grafana2026!}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - frontend_net

  # -------------------------------------------------------------
  # 8. LOG AGGREGATION: Grafana Loki
  # -------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.8
    container_name: hrm_loki
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - frontend_net

  # -------------------------------------------------------------
  # 9. LOG COLLECTOR: Promtail
  # -------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.8
    container_name: hrm_promtail
    restart: always
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - frontend_net

# -------------------------------------------------------------
# NETWORKS CONFIGURATION (Network Isolation)
# -------------------------------------------------------------
networks:
  frontend_net:
    driver: bridge
    name: hrm_frontend_net
  backend_net:
    driver: bridge
    name: hrm_backend_net

# -------------------------------------------------------------
# VOLUMES CONFIGURATION (Persistent Storage)
# -------------------------------------------------------------
volumes:
  mysql_data:
    name: hrm_mysql_data
  prometheus_data:
    name: hrm_prometheus_data
  grafana_data:
    name: hrm_grafana_data
  loki_data:
    name: hrm_loki_data
